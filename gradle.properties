# Performance & Build Speed Optimizations 2026 (Turbo Mode 2-5s)
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:SoftRefLRUPolicyMSPerMB=0
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Kotlin & Android Turbo Incremental Compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
android.useAndroidX=true
android.nonFinalResIds=true
kotlin.code.style=official

# Enable Jetpack Compose Strong Skipping Mode for zero unnecessary recompositions
kotlin.suppressExperimentalOTDWarning=true
