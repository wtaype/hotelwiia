# Performance & Build Speed Optimizations 2026
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android & Kotlin
android.useAndroidX=true
android.nonFinalResIds=true
kotlin.code.style=official

# Enable Jetpack Compose Strong Skipping Mode for zero unnecessary recompositions
kotlin.suppressExperimentalOTDWarning=true
