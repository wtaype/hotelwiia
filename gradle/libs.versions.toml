[versions]
agp            = "9.2.1"
kotlin         = "2.2.10"
composeBom     = "2026.02.01"
coreKtx        = "1.18.0"
activityCompose = "1.13.0"
supabase       = "3.1.2"
ktor           = "3.1.1"
serialization  = "1.8.0"

[libraries]
# AndroidX Core
androidx-core-ktx           = { group = "androidx.core",     name = "core-ktx",          version.ref = "coreKtx" }
androidx-activity-compose   = { group = "androidx.activity", name = "activity-compose",   version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version = "2.8.7" }
androidx-credentials         = { group = "androidx.credentials", name = "credentials", version = "1.3.0" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version = "1.3.0" }
google-id                    = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version = "1.1.1" }

# Compose BOM
androidx-compose-bom         = { group = "androidx.compose", name = "compose-bom",        version.ref = "composeBom" }
androidx-compose-ui          = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-material3   = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# Supabase Kotlin SDK BOM & Modules
supabase-auth                = { group = "io.github.jan-tennert.supabase", name = "auth-kt",       version.ref = "supabase" }
supabase-postgrest           = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt",  version.ref = "supabase" }
supabase-realtime            = { group = "io.github.jan-tennert.supabase", name = "realtime-kt",   version.ref = "supabase" }

# Ktor Client Engine for Android
ktor-client-android          = { group = "io.ktor",                         name = "ktor-client-android", version.ref = "ktor" }
kotlinx-serialization-json   = { group = "org.jetbrains.kotlinx",           name = "kotlinx-serialization-json", version.ref = "serialization" }

# Build plugins
android-gradlePlugin  = { group = "com.android.tools.build",   name = "gradle",                         version.ref = "agp" }
kotlin-gradlePlugin   = { group = "org.jetbrains.kotlin",      name = "kotlin-gradle-plugin",           version.ref = "kotlin" }
compose-gradlePlugin  = { group = "org.jetbrains.kotlin",      name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
android-library     = { id = "com.android.library",                 version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

